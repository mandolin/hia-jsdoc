# 中文：四个真实平台/运行组合执行相同发行门禁；不发布npm。
# English: Four actual platform/runtime combinations run the same release gate without npm publication.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: hia-jsdoc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.23.4
          - 24.22.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: hia-jsdoc

      # 中文：自文档化与来源回归需两个相邻owner，固定已验证SHA而非开发机目录或浮动分支。
      # English: Self-documentation and provenance tests require sibling owners pinned to verified SHAs, not developer folders or floating branches.
      - name: Check out source plugin owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-plugin-hia-sys
          ref: e75e9cef879e4e39b2554957d65edc384d3b5a9d
          path: jsdoc-plugin-hia-sys

      - name: Check out source theme owner
        uses: actions/checkout@v6
        with:
          repository: mandolin/jsdoc-theme-hia
          ref: 50420e1f429e37a8bccdb2da8c40c76f97b77c48
          path: jsdoc-theme-hia

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install frozen dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      # 中文：插件从自身位置读取JSDoc peer版本，缺依赖时按契约只输出身份而不声称源码范围。
      # English: The plugin reads its JSDoc peer from its own location; without dependencies it emits identity only, never a precise source range.
      - name: Install pinned plugin parser peer
        working-directory: jsdoc-plugin-hia-sys
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Run release gate
        run: npm run release:gate
